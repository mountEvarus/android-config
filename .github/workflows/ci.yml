name: CI

# Builds the sample app against the convention plugin. The sample exists precisely so this
# runs: it proves the plugin still applies, resolves the catalog and produces an APK before
# any app picks the change up via its submodule bump.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sample:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sample
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # The action still defaults to 'tools platform-tools', and Google removed
          # 'tools' from the SDK repository, so sdkmanager exits 1 during setup.
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build sample against the convention plugin
        run: ./gradlew ktlintCheck lintDebug testDebugUnitTest assembleDebug
